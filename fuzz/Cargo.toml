[package]
name    = "simd-json5-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[[bin]]
bench = false
doc   = false
name  = "parse"
path  = "fuzz_targets/parse.rs"
test  = false

[[bin]]
bench = false
doc   = false
name  = "de_dom_parity"
path  = "fuzz_targets/de_dom_parity.rs"
test  = false

[[bin]]
bench = false
doc   = false
name  = "typed_shapes"
path  = "fuzz_targets/typed_shapes.rs"
test  = false

[dependencies]
libfuzzer-sys = "0.4"
serde         = { version = "1", features = ["derive"] }

[dependencies.simd-json5]
path = ".."
